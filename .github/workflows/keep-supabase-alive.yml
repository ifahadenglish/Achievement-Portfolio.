# يُبقي مشروع Supabase المجاني نشطًا حتى لا يتوقف بسبب قلة النشاط.
# يقرأ صفًا واحدًا من البيانات المنشورة بالمفتاح العام (نفس المفتاح الموجود في الموقع).
# لا يحتاج أي مفتاح سري.
name: Keep Supabase alive

on:
  schedule:
    - cron: "17 6 * * *"   # يوميًا 09:17 بتوقيت الرياض
  workflow_dispatch: {}      # تشغيل يدوي من تبويب Actions

permissions:
  contents: write            # فقط لتسجيل تعديل صغير كل 50 يومًا (انظر الخطوة الثانية)

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: https://azanksoibdkbrdtwcrjy.supabase.co
          SUPABASE_KEY: sb_publishable_qbmUeSyXxkCcq5DsB5CjNg_VExuaQki
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /tmp/body -w '%{http_code}' \
              -H "apikey: $SUPABASE_KEY" \
              "$SUPABASE_URL/rest/v1/profile?select=id&limit=1")
            echo "attempt $i → HTTP $code"
            if [ "$code" = "200" ]; then cat /tmp/body; echo; exit 0; fi
            sleep 20
          done
          echo "::error::Supabase did not answer (HTTP $code). The project may be paused — open supabase.com/dashboard and restore it."
          exit 1

      # GitHub يوقف المهام المجدولة في المستودع العام إذا مرّ 60 يومًا بلا أي تعديل.
      # هذه الخطوة تسجّل تعديلًا صغيرًا في ملف .github/keepalive كل 50 يومًا لتبقى المهمة تعمل.
      - uses: actions/checkout@v4
      - name: Keep the schedule enabled
        run: |
          last=$(git log -1 --format=%ct)
          age=$(( ( $(date +%s) - last ) / 86400 ))
          echo "last commit: $age days ago"
          if [ "$age" -ge 50 ]; then
            date -u +%Y-%m-%dT%H:%M:%SZ > .github/keepalive
            git config user.name "keepalive-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/keepalive
            git commit -m "chore: keep scheduled workflow enabled"
            git push
          fi
